name: Vôlavo Hôte (exécutables PC)

on:
  push:
    branches: [main, master, "claude/**"]
    paths: ["host/**", ".github/workflows/host-app.yml"]
  pull_request:
    paths: ["host/**"]
  workflow_dispatch:

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: VolavoHote-Windows
          - os: macos-latest
            label: macOS
            artifact: VolavoHote-macOS
          - os: ubuntu-22.04
            label: Linux
            artifact: VolavoHote-Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: host
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances de build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Exécutable Windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name VolavoHote volavo_host.py
          mkdir -p out && cp dist/VolavoHote.exe out/

      - name: Application macOS
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name VolavoHote \
            --collect-submodules pynput --osx-bundle-identifier com.volavo.host volavo_host.py
          mkdir -p out && cd dist && ditto -c -k --keepParent VolavoHote.app ../out/VolavoHote-macOS.zip

      - name: Exécutable Linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --name VolavoHote \
            --collect-submodules pynput --collect-submodules evdev volavo_host.py
          mkdir -p out && cp dist/VolavoHote out/ && chmod +x out/VolavoHote

      - name: Test de démarrage (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          timeout 4 ./out/VolavoHote --headless --dry-run --no-bt > smoke.log 2>&1
          code=$?
          cat smoke.log
          test $code -eq 124 && grep -q "volavo://pair" smoke.log

      - name: Publier
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: host/out/*
          if-no-files-found: error
