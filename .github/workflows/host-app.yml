name: Vôlavo Hôte (Windows)

on:
  push:
    branches: [main, master, "claude/**"]
    paths: ["host/**", ".github/workflows/host-app.yml"]
  pull_request:
    paths: ["host/**"]
  workflow_dispatch:

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: host
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances de build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Tests
        run: |
          python -m unittest discover -s tests -v
          python -c "import rtmidi; print('rtmidi OK, ports:', rtmidi.MidiOut().get_ports())"

      - name: Compiler VolavoHote.exe (autonome, sans Python)
        run: pyinstaller --noconfirm --onefile --windowed --name VolavoHote --collect-all rtmidi volavo_host.py

      - name: Test de démarrage de l'exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\VolavoHote.exe" -ArgumentList "--headless","--dry-run","--no-bt","--port","50510" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "L'exe s'est arrêté (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path "$env:USERPROFILE\.volavo_host.json")) { Write-Error "Configuration non créée"; exit 1 }
          Write-Host "VolavoHote.exe démarre correctement."

      - name: Publier
        uses: actions/upload-artifact@v4
        with:
          name: VolavoHote-Windows
          path: host/dist/VolavoHote.exe
          if-no-files-found: error
