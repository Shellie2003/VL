name: Android APK

on:
  push:
    branches: [main, master, "claude/**"]
    paths-ignore: ["host/**", "**.md", ".github/workflows/host-app.yml"]
  pull_request:
    paths-ignore: ["host/**", "**.md", ".github/workflows/host-app.yml"]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (préinstallé sur le runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Clé de signature FIXE : chaque nouvel APK peut s'installer par-dessus le précédent.
      - name: Clé de signature debug
        run: cp ci/volavo-debug.keystore debug.keystore

      - name: Compiler l'APK
        run: gradle :app:assembleDebug --stacktrace --no-configuration-cache

      - name: Vérifier l'APK (signature, manifeste)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdk|testOnly|native-code|application-debuggable|launchable" || true
          if "$BT/aapt2" dump badging "$APK" | grep -q "testOnly"; then echo "::error::APK marqué testOnly"; exit 1; fi
          mkdir -p dist && cp "$APK" dist/Volavo.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Volavo-APK
          path: dist/Volavo.apk
          if-no-files-found: error
