name: Android APK

on:
  push:
    branches: [main, master, "claude/**"]
    paths-ignore: ["host/**", "**.md", ".github/workflows/host-app.yml"]
  pull_request:
    paths-ignore: ["host/**", "**.md", ".github/workflows/host-app.yml"]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (préinstallé sur le runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Clé de signature FIXE : chaque nouvel APK peut s'installer par-dessus le précédent.
      - name: Clé de signature debug
        run: cp ci/volavo-debug.keystore debug.keystore

      - name: Compiler l'APK
        run: gradle :app:assembleDebug --stacktrace --no-configuration-cache

      - name: Signer (v1 + v2 + v3) et vérifier l'APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          # Signature v1 forcée : certains installateurs constructeurs (MIUI) l'exigent.
          "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --min-sdk-version 24 \
            --out dist/Volavo.apk app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --verbose --print-certs dist/Volavo.apk | grep -E "Verified using|certificate DN"
          # Vérifie la v1 comme un ancien installateur (min-sdk 21) le ferait.
          "$BT/apksigner" verify --verbose --min-sdk-version 21 dist/Volavo.apk | tee verify.log | grep "v1 scheme"
          grep -q "v1 scheme (JAR signing): true" verify.log || { echo "::error::Signature v1 absente"; exit 1; }
          unzip -l dist/Volavo.apk | grep -E "META-INF/.*\.(SF|RSA)"
          "$BT/aapt2" dump badging dist/Volavo.apk | grep -E "^package|SdkVersion|targetSdk|testOnly|native-code|launchable" || true
          if "$BT/aapt2" dump badging dist/Volavo.apk | grep -q "testOnly"; then echo "::error::APK marqué testOnly"; exit 1; fi

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Volavo-APK
          path: dist/Volavo.apk
          if-no-files-found: error

  # Installe réellement l'APK sur un émulateur et lance l'app : donne le code
  # d'erreur exact (INSTALL_FAILED_...) ou détecte un plantage au démarrage.
  install-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Volavo-APK
          path: dist

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Installer et lancer sur l'émulateur (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emulator-install-test.sh dist/Volavo.apk
