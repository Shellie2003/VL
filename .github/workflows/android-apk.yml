name: Android APK

on:
  push:
    branches: [main, master, "claude/**"]
    paths-ignore: ["host/**", "**.md", ".github/workflows/host-app.yml"]
  pull_request:
    paths-ignore: ["host/**", "**.md", ".github/workflows/host-app.yml"]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (préinstallé sur le runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Clés FIXES : chaque nouvel APK s'installe par-dessus le précédent.
      - name: Clés de signature
        run: cp ci/volavo-debug.keystore debug.keystore

      - name: Compiler l'APK (release)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci/volavo-release.keystore
          STORE_PASSWORD: volavo-ci
          KEY_PASSWORD: volavo-ci
        run: gradle :app:assembleRelease --stacktrace --no-configuration-cache

      - name: Signer (v1 + v2 + v3) et vérifier l'APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          # Signature v1 forcée : certains installateurs constructeurs (MIUI) l'exigent.
          "$BT/apksigner" sign --ks ci/volavo-release.keystore --ks-pass pass:volavo-ci \
            --ks-key-alias upload --key-pass pass:volavo-ci \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --min-sdk-version 24 \
            --out dist/Volavo.apk app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --verbose --print-certs dist/Volavo.apk | grep -E "Verified using|certificate DN"
          # Vérifie la v1 comme un ancien installateur (min-sdk 21) le ferait.
          "$BT/apksigner" verify --verbose --min-sdk-version 21 dist/Volavo.apk | tee verify.log | grep "v1 scheme"
          grep -q "v1 scheme (JAR signing): true" verify.log || { echo "::error::Signature v1 absente"; exit 1; }
          unzip -l dist/Volavo.apk | grep -E "META-INF/.*\.(SF|RSA)"
          "$BT/aapt2" dump badging dist/Volavo.apk | grep -E "^package|SdkVersion|targetSdk|testOnly|native-code|launchable" || true
          if "$BT/aapt2" dump badging dist/Volavo.apk | grep -q "testOnly"; then echo "::error::APK marqué testOnly"; exit 1; fi
          sha256sum dist/Volavo.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Volavo-APK
          path: dist/Volavo.apk

      # Lien de téléchargement direct (un .apk, pas un zip, sans compte GitHub)
      - name: Publier en Release GitHub
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Vôlavo — dernier APK Android"
          prerelease: false
          make_latest: true
          files: dist/Volavo.apk
          body: |
            Téléchargez **Volavo.apk** ci-dessous et ouvrez-le sur le téléphone.
            Compilé depuis ${{ github.sha }}.
          if-no-files-found: error

  # Installe réellement l'APK sur un émulateur et lance l'app : donne le code
  # d'erreur exact (INSTALL_FAILED_...) ou détecte un plantage au démarrage.
  install-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 29, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Volavo-APK
          path: dist

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Installer et lancer sur l'émulateur (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emulator-install-test.sh dist/Volavo.apk && if [ "${{ matrix.api-level }}" = "34" ]; then bash ci/screenshots.sh; fi

      # Captures d'écran publiées sur la branche « ci-screenshots » (revue du design).
      - name: Publier les captures d'écran
        if: matrix.api-level == 34 && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/shots && cp shots/*.png /tmp/shots/
          git config user.name "volavo-ci"
          git config user.email "volavo-ci@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rf --cached . > /dev/null
          rm -rf shots && mkdir shots && cp /tmp/shots/*.png shots/
          git add -f shots/*.png
          git commit -m "Captures ${{ github.sha }}"
          git push -f origin ci-screenshots
